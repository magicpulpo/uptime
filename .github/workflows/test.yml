name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: node --test
      - name: targets.json is valid
        run: node -e "const t = JSON.parse(require('fs').readFileSync('targets.json', 'utf8')); if (!Array.isArray(t) || !t.every((x) => /^AUT-\d{3}$/.test(x.id) && x.name && /^https:\/\//.test(x.url))) process.exit(1)"
